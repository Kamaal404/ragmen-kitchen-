[project]
name = "ragmen-kitchen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema", "pyyaml", "mcp>=1.0.0"]

[project.scripts]
ragmen = "ragmen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires Docker and Neo4j"]

[tool.ruff]
target-version = "py311"
line-length = 120
